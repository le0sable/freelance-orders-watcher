name: notify

# Запуск на ~9 минут: площадки опрашиваются раз в 3 минуты, а бот сразу отвечает на команды
# и кнопки. В конце запуск сам ставит следующий (workflow_dispatch), и тот ждёт в очереди, пока
# текущий не закончится. Расписание — только запасной вариант, чтобы цепочка восстановилась
# после сбоя: GitHub выполняет cron с опозданием на часы.
# База market.db между запусками живёт в кэше Actions. В репозиторий она коммитится раз в 6 часов
# и сразу после команд или оценок 👍/👎 из Telegram (вместе с settings.json).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: notify
  cancel-in-progress: false

permissions:
  contents: write
  actions: write  # чтобы запустить следующий запуск

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache/restore@v4
        with:
          path: |
            market.db
            kwork_categories.json
          key: market-db-${{ github.run_id }}
          restore-keys: market-db-

      - name: Собрать заказы и отправить уведомления
        id: bot
        run: python3 notify.py --loop 540
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            market.db
            kwork_categories.json
          key: market-db-${{ github.run_id }}-${{ github.run_attempt }}

      # До коммита, чтобы сбой git push не рвал цепочку. После ошибки бота цепочку не продолжаем,
      # иначе упавший код перезапускался бы без остановки; её поднимет расписание.
      - name: Поставить следующий запуск
        if: always() && steps.bot.outcome == 'success'
        run: gh workflow run notify.yml --ref "${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Сохранить в репозиторий (после команд и оценок из Telegram или раз в 6 часов)
        run: |
          last=$(git log -1 --format=%ct -- market.db || echo 0)
          # запуски теперь почти все workflow_dispatch, поэтому тип события не проверяем
          if [ ! -f .changed ] && [ $(( $(date +%s) - ${last:-0} )) -lt 21600 ]; then
            echo "нечего сохранять"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market.db settings.json
          git diff --cached --quiet && exit 0
          git commit -m "data: база заказов и настройки"
          git pull --rebase -X theirs && git push
