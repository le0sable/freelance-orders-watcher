name: notify

# Каждые 10 минут запуск на ~9 минут: площадки опрашиваются раз в 3 минуты, а бот сразу
# отвечает на команды и кнопки. Следующий запуск ждёт в очереди, пока идёт текущий.
# База market.db между запусками живёт в кэше Actions. В репозиторий она коммитится раз в 6 часов
# и сразу после команд или оценок 👍/👎 из Telegram (вместе с settings.json).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: notify
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache/restore@v4
        with:
          path: market.db
          key: market-db-${{ github.run_id }}
          restore-keys: market-db-

      - name: Собрать заказы и отправить уведомления
        run: python3 notify.py --loop 540
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: market.db
          key: market-db-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Сохранить в репозиторий (после команд и оценок из Telegram или раз в 6 часов)
        run: |
          last=$(git log -1 --format=%ct -- market.db || echo 0)
          if [ ! -f .changed ] && [ "${{ github.event_name }}" = "schedule" ] \
             && [ $(( $(date +%s) - ${last:-0} )) -lt 21600 ]; then
            echo "нечего сохранять"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market.db settings.json
          [ -f kwork_categories.json ] && git add kwork_categories.json
          git diff --cached --quiet && exit 0
          git commit -m "data: база заказов и настройки"
          git pull --rebase -X theirs && git push
