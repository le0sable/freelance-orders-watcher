name: notify

# Каждые 10 минут: собрать новые заказы и прислать подходящие в Telegram.
# База market.db между запусками живёт в кэше Actions; раз в 6 часов снимок коммитится в репозиторий.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: notify
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache/restore@v4
        with:
          path: market.db
          key: market-db-${{ github.run_id }}
          restore-keys: market-db-

      - name: Собрать заказы и отправить уведомления
        run: python3 notify.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: market.db
          key: market-db-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Снимок базы в репозиторий (раз в 6 часов)
        run: |
          last=$(git log -1 --format=%ct -- market.db || echo 0)
          if [ "${{ github.event_name }}" = "schedule" ] && [ $(( $(date +%s) - ${last:-0} )) -lt 21600 ]; then
            echo "последний снимок моложе 6 часов"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market.db
          [ -f kwork_categories.json ] && git add kwork_categories.json
          git diff --cached --quiet && exit 0
          git commit -m "data: снимок базы заказов"
          git pull --rebase -X theirs && git push
